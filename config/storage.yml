test:
  service: Disk
  root: <%= Rails.root.join("tmp/storage") %>

local:
  service: Disk
  root: <%= Rails.root.join("storage") %>

# DigitalOcean Spaces (S3-compatible storage)
# Use bin/rails credentials:edit to set the DigitalOcean secrets:
#   digitalocean:
#     spaces_access_key_id: your_access_key
#     spaces_secret_access_key: your_secret_key
#     spaces_region: sfo3
#     spaces_bucket: ig-mcp-images
#     spaces_endpoint: https://sfo3.digitaloceanspaces.com
digitalocean:
  service: S3
  access_key_id: <%= Rails.application.credentials.dig(:digitalocean, :spaces_access_key_id) %>
  secret_access_key: <%= Rails.application.credentials.dig(:digitalocean, :spaces_secret_access_key) %>
  region: <%= Rails.application.credentials.dig(:digitalocean, :spaces_region) || "sfo3" %>
  bucket: <%= Rails.application.credentials.dig(:digitalocean, :spaces_bucket) || "ig-mcp-images" %>
  endpoint: <%= Rails.application.credentials.dig(:digitalocean, :spaces_endpoint) || "https://sfo3.digitaloceanspaces.com" %>
  # Make uploaded files publicly accessible (required for Instagram API)
  public: true

# Use bin/rails credentials:edit to set the AWS secrets (as aws:access_key_id|secret_access_key)
# amazon:
#   service: S3
#   access_key_id: <%= Rails.application.credentials.dig(:aws, :access_key_id) %>
#   secret_access_key: <%= Rails.application.credentials.dig(:aws, :secret_access_key) %>
#   region: us-east-1
#   bucket: your_own_bucket-<%= Rails.env %>

# Remember not to checkin your GCS keyfile to a repository
# google:
#   service: GCS
#   project: your_project
#   credentials: <%= Rails.root.join("path/to/gcs.keyfile") %>
#   bucket: your_own_bucket-<%= Rails.env %>

